name: fileshield

x-app: &app
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  environment: &environment
    FILESHIELD_ENV: ${FILESHIELD_ENV:-development}
    FILESHIELD_SECRET_KEY: ${FILESHIELD_SECRET_KEY:?Generate a secret key before starting}
    DATABASE_URL: postgresql+psycopg://fileshield:${POSTGRES_PASSWORD:?Set database password}@postgres:5432/fileshield
    REDIS_URL: redis://redis:6379/0
    STORAGE_ROOT: /data/jobs
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    REQUIRE_SCAN: ${REQUIRE_SCAN:-true}
    CLAMAV_HOST: clamav
    RETENTION_SECONDS: ${RETENTION_SECONDS:-3600}
    MAX_PROCESS_TIME: ${MAX_PROCESS_TIME:-60}
  volumes:
    - jobs:/data
  networks: [internal]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=134217728,mode=1777
  pids_limit: 128
  mem_limit: 1g
  cpus: 1
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    networks: [internal, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=134217728,mode=1777"]
    mem_limit: 256m
    pids_limit: 64
    depends_on: [backend]

  backend:
    <<: *app

  worker:
    <<: *app
    command: ["celery", "-A", "backend.workers.celery_app", "worker", "--loglevel=WARNING", "--concurrency=2", "--max-tasks-per-child=20"]
    mem_limit: 2g
    cpus: 2

  scheduler:
    <<: *app
    command: ["celery", "-A", "backend.workers.celery_app", "beat", "--loglevel=WARNING", "--schedule=/tmp/celerybeat"]
    mem_limit: 256m

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fileshield
      POSTGRES_USER: fileshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileshield -d fileshield"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    mem_limit: 512m

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "999:999"
    mem_limit: 256m

  clamav:
    image: clamav/clamav:stable
    volumes: ["signatures:/var/lib/clamav"]
    networks: [internal, updates]
    mem_limit: 2g
    cpus: 1
    security_opt: [no-new-privileges:true]

networks:
  internal:
    internal: true
  edge: {}
  updates: {}

volumes:
  jobs: {}
  database: {}
  signatures: {}